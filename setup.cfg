[metadata]
name = flywheel
version = 0.1.0
description = A modular CLI for registering resources and running Flywheel tasks.

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.10
install_requires =
    PyYAML>=6.0
    rich>=13.8
    typer>=0.27
    e2b>=2.38,<3

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    fw = flywheel.cli:main
